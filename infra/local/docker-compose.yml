name: wc-autopecas

x-servico: &servico
  restart: unless-stopped
  networks: [wc-net]
  env_file: [.env, init/resources.env]
  environment: &servico-env
    SPRING_PROFILES_ACTIVE: local
    REDIS_HOST: redis
  depends_on: &servico-deps
    localstack: { condition: service_healthy }
    redis: { condition: service_healthy }

services:
  localstack:
    image: localstack/localstack:3.8.1   # última linha da Community sem token de conta
    container_name: wc-localstack
    ports: ["4566:4566"]
    env_file: [.env]
    environment:
      SERVICES: dynamodb,sqs,sns,s3,secretsmanager,lambda,apigateway,ses,events,logs,iam,sts
      LAMBDA_DOCKER_NETWORK: wc-net
    volumes:
      - ./init:/etc/localstack/init
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/wc-init-done && curl -sf localhost:4566/_localstack/health >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 40
    networks: [wc-net]

  redis:
    image: redis:7.4-alpine
    container_name: wc-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks: [wc-net]

  auth-service:
    <<: *servico
    build: { context: ../../backend, args: { MODULE: auth-service } }
    container_name: wc-auth-service
    ports: ["8080:8080"]

networks:
  wc-net:
    name: wc-net

volumes:
  redis-data:
