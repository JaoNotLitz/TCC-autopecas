name: wc-autopecas

x-servico: &servico
  restart: unless-stopped
  networks: [wc-net]
  env_file: [.env, init/resources.env]
  environment: &servico-env
    SPRING_PROFILES_ACTIVE: local
    REDIS_HOST: redis
  depends_on: &servico-deps
    localstack: { condition: service_healthy }
    redis: { condition: service_healthy }

services:
  # Compila as Lambdas (jar com dependências) num volume que o LocalStack lê no init.
  lambda-build:
    build: { context: ../../backend, target: lambda, args: { MODULE: wc-jwt-authorizer } }
    container_name: wc-lambda-build
    volumes: [lambdas:/out]
    networks: [wc-net]

  lambda-build-dlq:
    build: { context: ../../backend, target: lambda, args: { MODULE: wc-dlq-lambdas } }
    container_name: wc-lambda-build-dlq
    volumes: [lambdas:/out]
    networks: [wc-net]

  localstack:
    image: localstack/localstack:3.8.1   # última linha da Community sem token de conta
    container_name: wc-localstack
    ports: ["4566:4566"]
    env_file: [.env]
    environment:
      SERVICES: dynamodb,sqs,sns,s3,secretsmanager,lambda,apigateway,ses,events,logs,iam,sts
      # o provider v2 do EventBridge executa as regras agendadas (o v1 do 3.8 não dispara)
      PROVIDER_OVERRIDE_EVENTS: v2
      LAMBDA_DOCKER_NETWORK: wc-net
      FRONT_ORIGIN: ${FRONT_ORIGIN}
    volumes:
      - ./init:/etc/localstack/init
      - lambdas:/opt/wc/lambdas:ro
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      lambda-build: { condition: service_completed_successfully }
      lambda-build-dlq: { condition: service_completed_successfully }
    healthcheck:
      # Saudável só quando todos os scripts de init terminaram sem erro (ver 99-done.sh).
      test: ["CMD-SHELL", "/etc/localstack/init/healthcheck.sh"]
      interval: 5s
      timeout: 5s
      retries: 60
    networks: [wc-net]

  redis:
    image: redis:7.4-alpine
    container_name: wc-redis
    # Sem persistência, como o LocalStack Community: se o Redis guardasse as chaves de
    # idempotência entre subidas, os ids recomeçados no DynamoDB colidiriam com elas e
    # operações novas de estoque seriam ignoradas como "já aplicadas".
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--save", "", "--appendonly", "no"]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks: [wc-net]

  auth-service:
    <<: *servico
    build: { context: ../../backend, args: { MODULE: auth-service } }
    container_name: wc-auth-service
    ports: ["8080:8080"]

  customer-service:
    <<: *servico
    build: { context: ../../backend, args: { MODULE: customer-service } }
    container_name: wc-customer-service
    ports: ["8081:8081"]
    environment:
      <<: *servico-env
      SERVER_PORT: 8081

  product-service:
    <<: *servico
    build: { context: ../../backend, args: { MODULE: product-service } }
    container_name: wc-product-service
    ports: ["8082:8082"]
    environment:
      <<: *servico-env
      SERVER_PORT: 8082

  sales-service:
    <<: *servico
    build: { context: ../../backend, args: { MODULE: sales-service } }
    container_name: wc-sales-service
    ports: ["8083:8083"]
    environment:
      <<: *servico-env
      SERVER_PORT: 8083
      CUSTOMER_SERVICE_URL: http://customer-service:8081
      PRODUCT_SERVICE_URL: http://product-service:8082

  fiscal-service:
    <<: *servico
    build: { context: ../../backend, args: { MODULE: fiscal-service } }
    container_name: wc-fiscal-service
    ports: ["8084:8084"]
    environment:
      <<: *servico-env
      SERVER_PORT: 8084
      SALES_SERVICE_URL: http://sales-service:8083
      CUSTOMER_SERVICE_URL: http://customer-service:8081
      PRODUCT_SERVICE_URL: http://product-service:8082
      SEFAZ_URL: http://sefaz-mock:8080
      SEFAZ_ESPERAS_RETENTATIVA: ${SEFAZ_ESPERAS_RETENTATIVA:-1m,5m}
    depends_on:
      <<: *servico-deps
      sefaz-mock: { condition: service_healthy }

  entry-service:
    <<: *servico
    build: { context: ../../backend, args: { MODULE: entry-service } }
    container_name: wc-entry-service
    ports: ["8085:8085"]
    environment:
      <<: *servico-env
      SERVER_PORT: 8085
      PRODUCT_SERVICE_URL: http://product-service:8082
      FISCAL_SERVICE_URL: http://fiscal-service:8084

  # DANFE (PDF), download do XML e lote de XMLs do contador.
  document-service:
    <<: *servico
    build: { context: ../../backend, args: { MODULE: document-service } }
    container_name: wc-document-service
    ports: ["8086:8086"]
    environment:
      <<: *servico-env
      SERVER_PORT: 8086
      CONTADOR_EMAIL: ${CONTADOR_EMAIL:-contador@wcautopecas.local}
      # O link do ZIP vai por e-mail e é aberto no navegador, então aponta para o LocalStack visto do host.
      S3_ENDERECO_PUBLICO: http://localhost:4566

  # CSV do Painel Fiscal (GET /api/notas/relatorio): pede a listagem ao fiscal-service.
  reports-service:
    <<: *servico
    build: { context: ../../backend, args: { MODULE: reports-service } }
    container_name: wc-reports-service
    ports: ["8087:8087"]
    environment:
      <<: *servico-env
      SERVER_PORT: 8087
      FISCAL_SERVICE_URL: http://fiscal-service:8084

  # E-mails por template no SES local (veja em http://localhost:4566/_aws/ses).
  notification-service:
    <<: *servico
    build: { context: ../../backend, args: { MODULE: notification-service } }
    container_name: wc-notification-service
    ports: ["8088:8088"]
    environment:
      <<: *servico-env
      SERVER_PORT: 8088
      ALERTA_ESTOQUE_DESTINATARIOS: ${ALERTA_ESTOQUE_DESTINATARIOS:-compras@wcautopecas.local}
      OPS_DESTINATARIOS: ${OPS_DESTINATARIOS:-ops@wcautopecas.local}

  # Simulador da SEFAZ (WireMock). Os cenários estão em sefaz-mock/README.md.
  sefaz-mock:
    image: wiremock/wiremock:3.9.2
    container_name: wc-sefaz-mock
    command: ["--disable-banner"]
    ports: ["8089:8080"]
    volumes: ["./sefaz-mock:/home/wiremock:ro"]
    networks: [wc-net]
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/__admin/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Perfil opcional (HU-B16.3): make observabilidade, ou docker compose --profile observabilidade up.
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: wc-prometheus
    profiles: [observabilidade]
    ports: ["9090:9090"]
    volumes: ["./observabilidade/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    networks: [wc-net]

  grafana:
    image: grafana/grafana:11.2.2
    container_name: wc-grafana
    profiles: [observabilidade]
    ports: ["3000:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/wc-autopecas.json
    volumes:
      - ./observabilidade/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observabilidade/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]
    networks: [wc-net]

networks:
  wc-net:
    name: wc-net

volumes:
  lambdas:
