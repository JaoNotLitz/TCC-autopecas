# Coleta o /actuator/prometheus de cada serviço (perfil "observabilidade" do Compose).
global:
  scrape_interval: 10s
scrape_configs:
  - job_name: wc-servicos
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - auth-service:8080
          - customer-service:8081
          - product-service:8082
          - sales-service:8083
          - fiscal-service:8084
          - entry-service:8085
          - document-service:8086
          - reports-service:8087
          - notification-service:8088
    relabel_configs:
      - source_labels: [__address__]
        regex: '([^:]+):.*'
        target_label: servico
