name: backend

on:
  pull_request:
    paths: ["backend/**", "infra/**", ".github/workflows/backend.yml"]
  push:
    branches: [main]
    paths: ["backend/**", "infra/**", ".github/workflows/backend.yml"]

jobs:
  testes:
    name: build e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: mvn verify (unitários + integração com Testcontainers)
        working-directory: backend
        run: mvn -B verify
      - name: Relatórios de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco
          path: backend/**/target/site/jacoco/
          if-no-files-found: ignore

  smoke:
    name: smoke do compose
    runs-on: ubuntu-latest
    needs: testes
    steps:
      - uses: actions/checkout@v4
      - name: Sobe a stack
        run: make up
      - name: Confere recursos do LocalStack
        run: make verify
      - name: Login com o usuário do seed
        run: |
          curl -sf -X POST localhost:8080/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"admin@wcautopecas.com.br","senha":"admin123"}' | grep -q '"token"'
      - name: Logs em caso de falha
        if: failure()
        run: docker compose -f infra/local/docker-compose.yml logs --tail=200
      - name: Derruba
        if: always()
        run: make reset
