# WC Autopeças pronta para rodar: só imagens publicadas, nada é compilado nesta máquina.
#   docker compose up -d --wait     (ou iniciar.bat no Windows / ./iniciar.sh)
# Tudo que pode mudar tem padrão aqui; para trocar, crie um .env ao lado (veja .env.exemplo).
name: wc-autopecas

x-env: &env
  AWS_DEFAULT_REGION: sa-east-1
  AWS_REGION: sa-east-1
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
  AWS_ENDPOINT_URL: http://localstack:4566
  REDIS_PASSWORD: ${REDIS_PASSWORD:-wc-redis-local}
  SEED_ADMIN_SENHA: ${SEED_ADMIN_SENHA:-admin123}
  SEED_VENDEDOR_SENHA: ${SEED_VENDEDOR_SENHA:-vendedor123}
  FRONT_ORIGIN: ${FRONT_ORIGIN:-http://localhost:5173}

x-servico: &servico
  image: ${WC_REGISTRO:-ghcr.io/jaonotlitz}/wc-servicos:${WC_VERSAO:-latest}
  restart: unless-stopped
  networks: [wc-net]
  # Cada JVM usa ~300 MB; os 9 serviços cabem em ~3 GB.
  mem_limit: 400m
  depends_on: &deps
    localstack: { condition: service_healthy }
    redis: { condition: service_healthy }

services:
  localstack:
    image: ${WC_REGISTRO:-ghcr.io/jaonotlitz}/wc-localstack:${WC_VERSAO:-latest}
    container_name: wc-localstack
    ports: ["4566:4566"]
    environment:
      <<: *env
      SERVICES: dynamodb,sqs,sns,s3,secretsmanager,lambda,apigateway,ses,events,logs,iam,sts
      PROVIDER_OVERRIDE_EVENTS: v2
      LAMBDA_DOCKER_NETWORK: wc-net
    volumes:
      # As Lambdas rodam em containers que o LocalStack cria pelo Docker da máquina.
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD-SHELL", "/etc/localstack/init/healthcheck.sh"]
      interval: 5s
      timeout: 5s
      retries: 90
    mem_limit: 1536m
    networks: [wc-net]

  redis:
    image: redis:7.4-alpine
    container_name: wc-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-wc-redis-local}", "--save", "", "--appendonly", "no"]
    ports: ["6379:6379"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-wc-redis-local}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 64m
    networks: [wc-net]

  sefaz-mock:
    image: ${WC_REGISTRO:-ghcr.io/jaonotlitz}/wc-sefaz-mock:${WC_VERSAO:-latest}
    container_name: wc-sefaz-mock
    command: ["--disable-banner"]
    ports: ["8089:8080"]
    environment:
      JAVA_OPTS: -Xmx96m -XX:+UseSerialGC
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/__admin/health"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 256m
    networks: [wc-net]

  auth-service:
    <<: *servico
    container_name: wc-auth-service
    ports: ["8080:8080"]
    environment:
      <<: *env
      SERVICO: auth-service
      SPRING_PROFILES_ACTIVE: local
      REDIS_HOST: redis

  customer-service:
    <<: *servico
    container_name: wc-customer-service
    ports: ["8081:8081"]
    environment:
      <<: *env
      SERVICO: customer-service
      SPRING_PROFILES_ACTIVE: local
      REDIS_HOST: redis
      SERVER_PORT: 8081

  product-service:
    <<: *servico
    container_name: wc-product-service
    ports: ["8082:8082"]
    environment:
      <<: *env
      SERVICO: product-service
      SPRING_PROFILES_ACTIVE: local
      REDIS_HOST: redis
      SERVER_PORT: 8082

  sales-service:
    <<: *servico
    container_name: wc-sales-service
    ports: ["8083:8083"]
    environment:
      <<: *env
      SERVICO: sales-service
      SPRING_PROFILES_ACTIVE: local
      REDIS_HOST: redis
      SERVER_PORT: 8083
      CUSTOMER_SERVICE_URL: http://customer-service:8081
      PRODUCT_SERVICE_URL: http://product-service:8082

  fiscal-service:
    <<: *servico
    container_name: wc-fiscal-service
    ports: ["8084:8084"]
    environment:
      <<: *env
      SERVICO: fiscal-service
      SPRING_PROFILES_ACTIVE: local
      REDIS_HOST: redis
      SERVER_PORT: 8084
      SALES_SERVICE_URL: http://sales-service:8083
      CUSTOMER_SERVICE_URL: http://customer-service:8081
      PRODUCT_SERVICE_URL: http://product-service:8082
      SEFAZ_URL: http://sefaz-mock:8080
      SEFAZ_ESPERAS_RETENTATIVA: ${SEFAZ_ESPERAS_RETENTATIVA:-1m,5m}
    depends_on:
      <<: *deps
      sefaz-mock: { condition: service_healthy }

  entry-service:
    <<: *servico
    container_name: wc-entry-service
    ports: ["8085:8085"]
    environment:
      <<: *env
      SERVICO: entry-service
      SPRING_PROFILES_ACTIVE: local
      REDIS_HOST: redis
      SERVER_PORT: 8085
      PRODUCT_SERVICE_URL: http://product-service:8082
      FISCAL_SERVICE_URL: http://fiscal-service:8084

  document-service:
    <<: *servico
    container_name: wc-document-service
    ports: ["8086:8086"]
    environment:
      <<: *env
      SERVICO: document-service
      SPRING_PROFILES_ACTIVE: local
      REDIS_HOST: redis
      SERVER_PORT: 8086
      CONTADOR_EMAIL: ${CONTADOR_EMAIL:-contador@wcautopecas.local}
      S3_ENDERECO_PUBLICO: http://localhost:4566

  reports-service:
    <<: *servico
    container_name: wc-reports-service
    ports: ["8087:8087"]
    environment:
      <<: *env
      SERVICO: reports-service
      SPRING_PROFILES_ACTIVE: local
      REDIS_HOST: redis
      SERVER_PORT: 8087
      FISCAL_SERVICE_URL: http://fiscal-service:8084
      SALES_SERVICE_URL: http://sales-service:8083
      PRODUCT_SERVICE_URL: http://product-service:8082
      CUSTOMER_SERVICE_URL: http://customer-service:8081

  notification-service:
    <<: *servico
    container_name: wc-notification-service
    ports: ["8088:8088"]
    environment:
      <<: *env
      SERVICO: notification-service
      SPRING_PROFILES_ACTIVE: local
      REDIS_HOST: redis
      SERVER_PORT: 8088
      ALERTA_ESTOQUE_DESTINATARIOS: ${ALERTA_ESTOQUE_DESTINATARIOS:-compras@wcautopecas.local}
      OPS_DESTINATARIOS: ${OPS_DESTINATARIOS:-ops@wcautopecas.local}

  # Tela da loja (repositório do front). Fica no perfil "front" até a imagem do front ser publicada;
  # depois é só tirar a linha "profiles" para subir junto por padrão.
  front:
    image: ${WC_FRONT_IMAGEM:-ghcr.io/dinastiadoge/tcc-front:latest}
    container_name: wc-front
    profiles: [front]
    ports: ["5173:80"]
    mem_limit: 64m
    depends_on:
      auth-service: { condition: service_healthy }
    networks: [wc-net]

networks:
  wc-net:
    name: wc-net
