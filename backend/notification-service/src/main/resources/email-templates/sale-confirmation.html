<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"></head>
<body style="margin:0;padding:0;background:#f3f4f6;font-family:Arial,Helvetica,sans-serif;color:#1f2937;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f3f4f6;padding:24px 0;">
<tr><td align="center">
<table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width:600px;width:100%;background:#ffffff;border-radius:8px;overflow:hidden;">
<tr><td style="background:#b91c1c;padding:20px 32px;color:#ffffff;font-size:20px;font-weight:bold;">WC Autopeças</td></tr>
<tr><td style="padding:32px;font-size:15px;line-height:1.6;">
<p style="margin:0 0 16px;font-size:18px;">Olá, <strong th:text="${clienteNome}">cliente</strong>!</p>
<p style="margin:0 0 24px;">Obrigado pela sua compra. Estes são os dados da venda:</p>
<table role="presentation" cellpadding="0" cellspacing="0" style="width:100%;border:1px solid #e5e7eb;border-radius:6px;">
<tr><td style="padding:12px 16px;color:#6b7280;">Venda</td><td style="padding:12px 16px;text-align:right;font-weight:bold;" th:text="${numero ?: vendaId}">000001</td></tr>
<tr><td style="padding:12px 16px;color:#6b7280;border-top:1px solid #e5e7eb;">Total</td><td style="padding:12px 16px;text-align:right;font-weight:bold;border-top:1px solid #e5e7eb;" th:text="${'R$ ' + #numbers.formatDecimal(valorTotal, 1, 'POINT', 2, 'COMMA')}">R$ 0,00</td></tr>
</table>
<p style="margin:24px 0 0;" th:if="${notaFiscalId != null}">A nota fiscal da compra foi emitida e pode ser pedida na loja.</p>
</td></tr>
<tr><td style="padding:16px 32px;background:#f9fafb;color:#6b7280;font-size:12px;">Mensagem automática da WC Autopeças. Não responda este e-mail.</td></tr>
</table>
</td></tr>
</table>
</body>
</html>
