spring:
  application:
    name: reports-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  jackson:
    default-property-inclusion: always
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: ${SERVER_PORT:8087}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    enabled: false

wc:
  aws:
    endpoint: ${AWS_ENDPOINT_URL:}
    region: ${AWS_REGION:sa-east-1}
    tabela-counters: ${TABLE_COUNTERS:counters}
  jwt:
    secret-name: ${SECRET_JWT:wc-jwt-secret}
  cors:
    origens: ${FRONT_ORIGIN:http://localhost:5173}
  seguranca:
    caminhos-publicos:
      - /actuator/**
      - /v3/api-docs/**
      - /swagger-ui/**
      - /swagger-ui.html
  relatorios:
    fiscal-url: ${FISCAL_SERVICE_URL:http://fiscal-service:8084}
---
spring:
  config:
    activate:
      on-profile: local
springdoc:
  api-docs:
    enabled: true
