spring:
  application:
    name: sales-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  jackson:
    default-property-inclusion: always
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: ${SERVER_PORT:8083}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    enabled: false

wc:
  aws:
    endpoint: ${AWS_ENDPOINT_URL:}
    region: ${AWS_REGION:sa-east-1}
    tabela-counters: ${TABLE_COUNTERS:counters}
  jwt:
    secret-name: ${SECRET_JWT:wc-jwt-secret}
  cors:
    origens: ${FRONT_ORIGIN:http://localhost:5173}
  seguranca:
    caminhos-publicos:
      - /actuator/**
      - /v3/api-docs/**
      - /swagger-ui/**
      - /swagger-ui.html
  vendas:
    tabela-vendas: ${TABLE_SALES:sales}
    tabela-itens: ${TABLE_SALE_ITEMS:sale_items}
    fila-estoque: ${QUEUE_INVENTORY_UPDATES:inventory-updates-queue}
    topico-vendas: ${TOPIC_SALES_EVENTS:sales-events-topic}
    topico-notificacoes: ${TOPIC_SALES_NOTIFICATIONS:sales-notifications-topic}
    notificacao-minimo: ${VENDA_NOTIFICACAO_MINIMO:0}
    customer-url: ${CUSTOMER_SERVICE_URL:http://customer-service:8081}
    product-url: ${PRODUCT_SERVICE_URL:http://product-service:8082}
    timeout-chamadas: 2s
---
spring:
  config:
    activate:
      on-profile: local
springdoc:
  api-docs:
    enabled: true
